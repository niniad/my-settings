<!--
  Pattern: cycle
  Theme: Clean Light
  Category: Diagram
  Text Guidelines:
  - Title: max 30 characters
  - Steps: 3 to 5 cycle nodes
  - Each step label: max 12 characters
  - Each step detail: max 25 characters
  Note: CSS-only circular arrangement. 4 steps works best visually.
        For 3 steps the triangle is natural, 5 steps can be tight.
-->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 960px; height: 540px;
    background: #FFFFFF;
    font-family: Arial, Helvetica, sans-serif;
    overflow: hidden;
    position: relative;
  }
  .top-bar {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 4px;
    background: #0055CC;
  }
  .nav {
    position: absolute; top: 18px; left: 60px;
    font-size: 11px; font-weight: 700;
    color: #0055CC; letter-spacing: 2px;
    text-transform: uppercase;
  }
  .page-num {
    position: absolute; bottom: 20px; right: 40px;
    font-size: 11px; color: #CCCCCC; letter-spacing: 1px;
  }
  .slide-inner {
    position: absolute;
    left: 60px; top: 50px;
    width: 840px; height: 460px;
    padding-top: 10px;
  }
  h2 {
    font-size: 28px; font-weight: 700;
    color: #111111;
    letter-spacing: -1px;
    margin-bottom: 12px;
    padding-bottom: 8px;
    border-bottom: 2px solid #EEEEEE;
  }
  /* Cycle layout: positioned nodes around a center */
  .cycle-area {
    position: relative;
    width: 600px;
    height: 360px;
    margin: 0 auto;
  }
  /* Center circle */
  .center-node {
    position: absolute;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 100px; height: 100px;
    background: #0055CC;
    border-radius: 50%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    z-index: 2;
  }
  .center-label {
    font-size: 14px; font-weight: 700;
    color: white;
    text-align: center;
    line-height: 1.3;
  }
  /* Step nodes: positioned at 4 corners */
  .step-node {
    position: absolute;
    width: 110px; height: 110px;
    background: #F5F5F5;
    border: 3px solid #0055CC;
    border-radius: 50%;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    text-align: center;
    padding: 8px;
    z-index: 2;
  }
  /* Top center */
  .node-1 { top: 0; left: 50%; transform: translateX(-50%); }
  /* Right */
  .node-2 { top: 50%; right: 0; transform: translateY(-50%); }
  /* Bottom center */
  .node-3 { bottom: 0; left: 50%; transform: translateX(-50%); }
  /* Left */
  .node-4 { top: 50%; left: 0; transform: translateY(-50%); }

  .node-num {
    font-size: 11px; font-weight: 700;
    color: #0055CC;
    letter-spacing: 1px;
    margin-bottom: 2px;
  }
  .node-label {
    font-size: 14px; font-weight: 700;
    color: #111111;
    line-height: 1.2;
  }
  /* Arrows (CSS borders) connecting nodes */
  .arrow {
    position: absolute;
    z-index: 1;
  }
  /* Side description cards */
  .desc-cards {
    position: absolute;
    right: -200px;
    top: 0;
    width: 180px;
    display: flex; flex-direction: column; gap: 12px;
  }
  .desc-card {
    background: #F5F5F5;
    padding: 10px 12px;
  }
  .desc-num {
    font-size: 11px; font-weight: 700;
    color: #0055CC;
    margin-bottom: 4px;
  }
  .desc-text {
    font-size: 13px; color: #555555;
    line-height: 1.3;
  }
</style>
</head>
<body>
  <div class="top-bar"></div>
  <p class="nav">03. 継続改善</p>
  <p class="page-num">17</p>
  <div class="slide-inner">
    <h2>PDCAサイクル（継続的改善プロセス）</h2>
    <div class="cycle-area">
      <!-- Center -->
      <div class="center-node">
        <p class="center-label">継続的<br>改善</p>
      </div>

      <!-- 4 step nodes -->
      <div class="step-node node-1">
        <p class="node-num">01</p>
        <p class="node-label">Plan<br>計画</p>
      </div>
      <div class="step-node node-2">
        <p class="node-num">02</p>
        <p class="node-label">Do<br>実行</p>
      </div>
      <div class="step-node node-3">
        <p class="node-num">03</p>
        <p class="node-label">Check<br>評価</p>
      </div>
      <div class="step-node node-4">
        <p class="node-num">04</p>
        <p class="node-label">Act<br>改善</p>
      </div>

      <!-- Description cards -->
      <div class="desc-cards">
        <div class="desc-card">
          <p class="desc-num">01 PLAN</p>
          <p class="desc-text">目標設定・KPI定義・施策立案</p>
        </div>
        <div class="desc-card">
          <p class="desc-num">02 DO</p>
          <p class="desc-text">施策の実装・運用・展開</p>
        </div>
        <div class="desc-card">
          <p class="desc-num">03 CHECK</p>
          <p class="desc-text">効果測定・データ分析・課題抽出</p>
        </div>
        <div class="desc-card">
          <p class="desc-num">04 ACT</p>
          <p class="desc-text">仮説更新・次サイクルへの反映</p>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
