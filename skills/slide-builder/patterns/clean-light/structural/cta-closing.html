<!--
  Pattern: cta-closing
  Theme: Clean Light
  Category: Structural
  Text Guidelines:
  - Title: max 25 characters (e.g., "次のアクション", "ご提案")
  - CTA headline: max 40 characters (main ask or next step)
  - Action items: 1 to 3 specific actions with owner/deadline
  - Each action: max 40 chars label + 20 chars detail
  - Contact info: optional
-->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 960px; height: 540px;
    background: #FFFFFF;
    font-family: Arial, Helvetica, sans-serif;
    overflow: hidden;
    position: relative;
  }
  .top-bar {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 4px;
    background: #0055CC;
  }
  .page-num {
    position: absolute; bottom: 20px; right: 40px;
    font-size: 11px; color: #CCCCCC; letter-spacing: 1px;
  }
  .slide-inner {
    position: absolute;
    left: 60px; top: 50px;
    width: 840px; height: 470px;
    padding-top: 20px;
  }
  h2 {
    font-size: 32px; font-weight: 700;
    color: #111111;
    letter-spacing: -1px;
    margin-bottom: 10px;
  }
  .cta-headline {
    font-size: 22px; color: #0055CC;
    font-weight: 400; margin-bottom: 32px;
  }
  .actions {
    display: flex; flex-direction: column; gap: 16px;
  }
  .action-item {
    display: flex; align-items: flex-start; gap: 0;
    background: #F5F5F5;
    padding: 16px 20px;
  }
  .action-num {
    font-size: 28px; font-weight: 700;
    color: #0055CC;
    width: 48px;
    flex-shrink: 0;
    line-height: 1;
    margin-top: 2px;
  }
  .action-content { flex: 1; }
  .action-label {
    font-size: 18px; font-weight: 700;
    color: #111111;
    margin-bottom: 4px;
  }
  .action-detail {
    font-size: 13px; color: #888888;
  }
  .action-meta {
    font-size: 12px; font-weight: 700;
    color: #0055CC;
    text-align: right;
    white-space: nowrap;
  }
</style>
</head>
<body>
  <div class="top-bar"></div>
  <p class="page-num">19</p>
  <div class="slide-inner">
    <h2>次のアクション</h2>
    <p class="cta-headline">本日のご承認をもとに、4月より実行フェーズへ移行します</p>
    <div class="actions">
      <div class="action-item">
        <div class="action-num">1</div>
        <div class="action-content">
          <p class="action-label">予算計画書の最終承認</p>
          <p class="action-detail">経営会議にて承認後、調達部門へ発注指示</p>
        </div>
        <p class="action-meta">4月15日 / 経営会議</p>
      </div>
      <div class="action-item">
        <div class="action-num">2</div>
        <div class="action-content">
          <p class="action-label">外部ベンダー選定・契約締結</p>
          <p class="action-detail">3社コンペを経て最終ベンダーを決定</p>
        </div>
        <p class="action-meta">4月末 / 調達部</p>
      </div>
      <div class="action-item">
        <div class="action-num">3</div>
        <div class="action-content">
          <p class="action-label">プロジェクトキックオフ</p>
          <p class="action-detail">PMO設置・スコープ確定・体制構築</p>
        </div>
        <p class="action-meta">5月1日 / 企画部</p>
      </div>
    </div>
  </div>
</body>
</html>
