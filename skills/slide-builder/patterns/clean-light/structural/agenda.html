<!--
  Pattern: agenda
  Theme: Clean Light
  Category: Structural
  Text Guidelines:
  - Title: max 20 characters (typically "アジェンダ" or "目次")
  - Items: 3 to 6 items
  - Item label: max 30 characters per item
  - Optional: short description per item (max 40 chars)
-->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 960px; height: 540px;
    background: #FFFFFF;
    font-family: Arial, Helvetica, sans-serif;
    overflow: hidden;
    position: relative;
  }
  .top-bar {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 4px;
    background: #0055CC;
  }
  .page-num {
    position: absolute; bottom: 20px; right: 40px;
    font-size: 11px; color: #CCCCCC; letter-spacing: 1px;
  }
  .slide-inner {
    position: absolute;
    left: 60px; top: 50px;
    width: 840px; height: 470px;
    padding-top: 20px;
  }
  h2 {
    font-size: 32px; font-weight: 700;
    color: #111111;
    letter-spacing: -1px;
    margin-bottom: 36px;
    padding-bottom: 14px;
    border-bottom: 2px solid #EEEEEE;
  }
  .agenda-list {
    display: flex; flex-direction: column; gap: 0;
  }
  .agenda-item {
    display: flex; align-items: center;
    padding: 14px 0;
    border-bottom: 1px solid #EEEEEE;
  }
  .item-num {
    font-size: 13px; font-weight: 700;
    color: #0055CC;
    letter-spacing: 1px;
    width: 40px;
    flex-shrink: 0;
  }
  .item-label {
    font-size: 20px; font-weight: 700;
    color: #111111;
    flex: 1;
  }
  .item-desc {
    font-size: 14px;
    color: #888888;
    text-align: right;
  }
</style>
</head>
<body>
  <div class="top-bar"></div>
  <p class="page-num">02</p>
  <div class="slide-inner">
    <h2>アジェンダ</h2>
    <div class="agenda-list">
      <div class="agenda-item">
        <span class="item-num">01</span>
        <span class="item-label">市場環境と現状分析</span>
        <span class="item-desc">5 min</span>
      </div>
      <div class="agenda-item">
        <span class="item-num">02</span>
        <span class="item-label">課題の特定と優先度整理</span>
        <span class="item-desc">10 min</span>
      </div>
      <div class="agenda-item">
        <span class="item-num">03</span>
        <span class="item-label">施策案と実行計画</span>
        <span class="item-desc">15 min</span>
      </div>
      <div class="agenda-item">
        <span class="item-num">04</span>
        <span class="item-label">期待効果とKPI設定</span>
        <span class="item-desc">5 min</span>
      </div>
      <div class="agenda-item">
        <span class="item-num">05</span>
        <span class="item-label">まとめと次のアクション</span>
        <span class="item-desc">5 min</span>
      </div>
    </div>
  </div>
</body>
</html>
