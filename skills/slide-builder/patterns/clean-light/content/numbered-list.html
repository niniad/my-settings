<!--
  Pattern: numbered-list
  Theme: Clean Light
  Category: Content
  Text Guidelines:
  - Title: max 30 characters
  - Steps: 4 to 6 numbered items
  - Each step title: max 30 characters
  - Each step detail: max 55 characters
  Note: Use when order matters (process, procedure, ranking).
-->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 960px; height: 540px;
    background: #FFFFFF;
    font-family: Arial, Helvetica, sans-serif;
    overflow: hidden;
    position: relative;
  }
  .top-bar {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 4px;
    background: #0055CC;
  }
  .nav {
    position: absolute; top: 18px; left: 60px;
    font-size: 11px; font-weight: 700;
    color: #0055CC; letter-spacing: 2px;
    text-transform: uppercase;
  }
  .page-num {
    position: absolute; bottom: 20px; right: 40px;
    font-size: 11px; color: #CCCCCC; letter-spacing: 1px;
  }
  .slide-inner {
    position: absolute;
    left: 60px; top: 50px;
    width: 840px; height: 470px;
    padding-top: 16px;
  }
  h2 {
    font-size: 34px; font-weight: 700;
    color: #111111;
    letter-spacing: -1px;
    margin-bottom: 28px;
    padding-bottom: 14px;
    border-bottom: 2px solid #EEEEEE;
  }
  .step-list {
    display: flex; flex-direction: column; gap: 12px;
  }
  .step-item {
    display: flex; align-items: flex-start; gap: 20px;
  }
  .step-num-wrap {
    display: flex; flex-direction: column;
    align-items: center; flex-shrink: 0; width: 36px;
  }
  .step-num {
    width: 36px; height: 36px;
    background: #0055CC;
    color: white;
    font-size: 16px; font-weight: 700;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
  }
  .step-connector {
    width: 2px; height: 20px;
    background: #EEEEEE;
    margin-top: 0;
  }
  .step-content { flex: 1; padding-top: 6px; }
  .step-title {
    font-size: 18px; font-weight: 700;
    color: #111111;
    margin-bottom: 3px;
  }
  .step-detail {
    font-size: 14px; color: #888888;
    line-height: 1.4;
  }
</style>
</head>
<body>
  <div class="top-bar"></div>
  <p class="nav">03. 実行計画</p>
  <p class="page-num">10</p>
  <div class="slide-inner">
    <h2>プロジェクト推進ステップ</h2>
    <div class="step-list">
      <div class="step-item">
        <div class="step-num-wrap">
          <div class="step-num">1</div>
          <div class="step-connector"></div>
        </div>
        <div class="step-content">
          <p class="step-title">現状調査・課題定義（4月）</p>
          <p class="step-detail">ユーザーインタビュー・データ分析で具体的なボトルネックを特定</p>
        </div>
      </div>
      <div class="step-item">
        <div class="step-num-wrap">
          <div class="step-num">2</div>
          <div class="step-connector"></div>
        </div>
        <div class="step-content">
          <p class="step-title">要件定義・ベンダー選定（5月）</p>
          <p class="step-detail">機能要件を確定し、3社コンペで最適ベンダーを選定する</p>
        </div>
      </div>
      <div class="step-item">
        <div class="step-num-wrap">
          <div class="step-num">3</div>
          <div class="step-connector"></div>
        </div>
        <div class="step-content">
          <p class="step-title">開発・テスト（6〜8月）</p>
          <p class="step-detail">アジャイル開発でMVP構築、UAT実施後に本番環境へ展開</p>
        </div>
      </div>
      <div class="step-item">
        <div class="step-num-wrap">
          <div class="step-num">4</div>
          <div class="step-connector"></div>
        </div>
        <div class="step-content">
          <p class="step-title">段階リリース・効果測定（9月〜）</p>
          <p class="step-detail">10%→50%→全体の段階展開でリスクを最小化しつつKPIを検証</p>
        </div>
      </div>
      <div class="step-item">
        <div class="step-num-wrap">
          <div class="step-num">5</div>
        </div>
        <div class="step-content">
          <p class="step-title">定着化・継続改善（10月〜）</p>
          <p class="step-detail">月次レビューで効果を定量評価、PDCAサイクルを定常化</p>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
