<!--
  Pattern: bullets
  Theme: Clean Light
  Category: Content
  Text Guidelines:
  - Title: max 30 characters
  - Bullets: 4 to 7 items
  - Each bullet: max 45 characters (main point)
  - Sub-bullet: max 55 characters (optional, 1 level only)
  - Section label (top nav): max 20 characters
-->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 960px; height: 540px;
    background: #FFFFFF;
    font-family: Arial, Helvetica, sans-serif;
    overflow: hidden;
    position: relative;
  }
  .top-bar {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 4px;
    background: #0055CC;
  }
  .nav {
    position: absolute; top: 18px; left: 60px;
    font-size: 11px; font-weight: 700;
    color: #0055CC; letter-spacing: 2px;
    text-transform: uppercase;
  }
  .page-num {
    position: absolute; bottom: 20px; right: 40px;
    font-size: 11px; color: #CCCCCC; letter-spacing: 1px;
  }
  .slide-inner {
    position: absolute;
    left: 60px; top: 50px;
    width: 840px; height: 470px;
    padding-top: 16px;
  }
  h2 {
    font-size: 34px; font-weight: 700;
    color: #111111;
    letter-spacing: -1px;
    margin-bottom: 28px;
    padding-bottom: 14px;
    border-bottom: 2px solid #EEEEEE;
  }
  .bullet-list {
    display: flex; flex-direction: column; gap: 0;
  }
  .bullet-item {
    display: flex; align-items: flex-start; gap: 16px;
    padding: 10px 0;
    border-bottom: 1px solid #F5F5F5;
  }
  .bullet-dot {
    width: 8px; height: 8px;
    background: #0055CC;
    border-radius: 50%;
    flex-shrink: 0;
    margin-top: 8px;
  }
  .bullet-text {
    flex: 1;
  }
  .bullet-main {
    font-size: 19px; font-weight: 700;
    color: #111111;
    line-height: 1.3;
    margin-bottom: 2px;
  }
  .bullet-sub {
    font-size: 14px; color: #888888;
    line-height: 1.4;
  }
</style>
</head>
<body>
  <div class="top-bar"></div>
  <p class="nav">02. 課題分析</p>
  <p class="page-num">05</p>
  <div class="slide-inner">
    <h2>現状の主要課題</h2>
    <div class="bullet-list">
      <div class="bullet-item">
        <div class="bullet-dot"></div>
        <div class="bullet-text">
          <p class="bullet-main">モバイルアプリのUXが競合他社より3年遅れている</p>
          <p class="bullet-sub">直近のユーザー調査でも満足度スコアが業界最下位水準</p>
        </div>
      </div>
      <div class="bullet-item">
        <div class="bullet-dot"></div>
        <div class="bullet-text">
          <p class="bullet-main">商品レコメンド精度が低く、回遊率・購買転換率が低迷</p>
          <p class="bullet-sub">カート離脱率が68%と業界平均の1.4倍</p>
        </div>
      </div>
      <div class="bullet-item">
        <div class="bullet-dot"></div>
        <div class="bullet-text">
          <p class="bullet-main">広告費の配分最適化が未対応で費用対効果が悪化中</p>
          <p class="bullet-sub">CPA（顧客獲得単価）が前年比で32%上昇</p>
        </div>
      </div>
      <div class="bullet-item">
        <div class="bullet-dot"></div>
        <div class="bullet-text">
          <p class="bullet-main">データ分析基盤が分散しており意思決定が遅い</p>
          <p class="bullet-sub">施策効果の把握に平均3週間かかる構造的問題</p>
        </div>
      </div>
      <div class="bullet-item">
        <div class="bullet-dot"></div>
        <div class="bullet-text">
          <p class="bullet-main">顧客LTVの把握・活用ができていない</p>
          <p class="bullet-sub">優良顧客向けの特別施策がほぼ存在しない状態</p>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
