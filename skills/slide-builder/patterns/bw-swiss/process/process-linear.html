<!--
  Pattern: process-linear
  Theme: B&W Swiss
  Category: Process
  Text Guidelines:
  - Title: max 30 characters
  - Steps: 3 to 5 (horizontal flow)
  - Step label: max 12 characters
  - Step detail: max 30 characters
-->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 960px; height: 540px;
    background: #FFFFFF;
    font-family: Arial, Helvetica, sans-serif;
    overflow: hidden;
    position: relative;
  }
  .band {
    position: absolute; left: 0; top: 0;
    width: 50px; height: 100%;
    background: #000000;
    display: flex; align-items: center; justify-content: center;
  }
  .band-label {
    writing-mode: vertical-rl;
    transform: rotate(180deg);
    font-size: 10px; font-weight: 700;
    color: rgba(255,255,255,0.5);
    letter-spacing: 3px;
    text-transform: uppercase;
  }
  .slide-inner {
    position: absolute;
    left: 70px; top: 40px;
    width: 860px; height: 460px;
  }
  h2 {
    font-size: 13px; font-weight: 700;
    color: #666666;
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .title-rule {
    width: 100%; height: 2px;
    background: #000000;
    margin-bottom: 8px;
  }
  .slide-title {
    font-size: 24px; font-weight: 700;
    color: #000000;
    letter-spacing: -1px;
    margin-bottom: 36px;
    text-transform: uppercase;
  }
  .process-flow {
    display: flex;
    align-items: flex-start;
    justify-content: space-between;
    position: relative;
  }
  .process-flow::before {
    content: '';
    position: absolute;
    top: 40px;
    left: 70px; right: 70px;
    height: 2px;
    background: #DDDDDD;
    z-index: 0;
  }
  .step {
    display: flex; flex-direction: column;
    align-items: center;
    width: 160px;
    position: relative;
    z-index: 1;
  }
  .step-box {
    width: 80px; height: 80px;
    background: #000000;
    color: white;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    margin-bottom: 16px;
    flex-shrink: 0;
  }
  .step.done .step-box { background: #AAAAAA; }
  .step.active .step-box { background: #000000; outline: 4px solid #AAAAAA; outline-offset: 3px; }
  .step-num {
    font-size: 10px; font-weight: 700;
    opacity: 0.6;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .step-label {
    font-size: 15px; font-weight: 700;
    color: #000000;
    text-align: center;
    margin-bottom: 6px;
    text-transform: uppercase;
    letter-spacing: -0.3px;
  }
  .step-detail {
    font-size: 12px; color: #888888;
    text-align: center;
    line-height: 1.3;
  }
  .step-tag {
    font-size: 11px; font-weight: 700;
    color: #555555;
    margin-top: 6px;
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }
</style>
</head>
<body>
  <div class="band">
    <p class="band-label">03. Process</p>
  </div>
  <div class="slide-inner">
    <h2>03 — 実行計画</h2>
    <div class="title-rule"></div>
    <p class="slide-title">プロジェクト実施フロー</p>
    <div class="process-flow">
      <div class="step done">
        <div class="step-box"><span class="step-num">Step 1</span></div>
        <p class="step-label">現状調査</p>
        <p class="step-detail">データ収集<br>ヒアリング</p>
        <p class="step-tag">4月 / 完了</p>
      </div>
      <div class="step active">
        <div class="step-box"><span class="step-num">Step 2</span></div>
        <p class="step-label">要件定義</p>
        <p class="step-detail">機能確定<br>ベンダー選定</p>
        <p class="step-tag">5月 / 進行中</p>
      </div>
      <div class="step">
        <div class="step-box"><span class="step-num">Step 3</span></div>
        <p class="step-label">開発</p>
        <p class="step-detail">MVP構築<br>UAT実施</p>
        <p class="step-tag">6〜8月</p>
      </div>
      <div class="step">
        <div class="step-box"><span class="step-num">Step 4</span></div>
        <p class="step-label">リリース</p>
        <p class="step-detail">段階展開<br>効果測定</p>
        <p class="step-tag">9月〜</p>
      </div>
      <div class="step">
        <div class="step-box"><span class="step-num">Step 5</span></div>
        <p class="step-label">定着化</p>
        <p class="step-detail">PDCA運用<br>継続改善</p>
        <p class="step-tag">10月〜</p>
      </div>
    </div>
  </div>
</body>
</html>
