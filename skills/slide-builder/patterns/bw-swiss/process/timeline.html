<!--
  Pattern: timeline
  Theme: B&W Swiss
  Category: Process
  Text Guidelines:
  - Title: max 30 characters
  - Events: 4 to 6 milestones
  - Each date: max 12 characters
  - Each label: max 25 characters
  - Each detail: max 40 characters
-->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 960px; height: 540px;
    background: #FFFFFF;
    font-family: Arial, Helvetica, sans-serif;
    overflow: hidden;
    position: relative;
  }
  .band {
    position: absolute; left: 0; top: 0;
    width: 50px; height: 100%;
    background: #000000;
    display: flex; align-items: center; justify-content: center;
  }
  .band-label {
    writing-mode: vertical-rl;
    transform: rotate(180deg);
    font-size: 10px; font-weight: 700;
    color: rgba(255,255,255,0.5);
    letter-spacing: 3px;
    text-transform: uppercase;
  }
  .slide-inner {
    position: absolute;
    left: 70px; top: 40px;
    width: 860px; height: 460px;
  }
  h2 {
    font-size: 13px; font-weight: 700;
    color: #666666;
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .title-rule {
    width: 100%; height: 2px;
    background: #000000;
    margin-bottom: 8px;
  }
  .slide-title {
    font-size: 24px; font-weight: 700;
    color: #000000;
    letter-spacing: -1px;
    margin-bottom: 20px;
    text-transform: uppercase;
  }
  .timeline-wrap {
    position: relative;
    margin-top: 60px;
    height: 260px;
  }
  .timeline-axis {
    position: absolute;
    top: 50%; left: 0; right: 0;
    height: 2px;
    background: #000000;
    transform: translateY(-50%);
  }
  .event {
    position: absolute;
    top: 50%;
    transform: translateX(-50%);
    display: flex; flex-direction: column;
    align-items: center;
  }
  .event-dot {
    width: 14px; height: 14px;
    background: #000000;
    position: absolute;
    top: 50%; transform: translateY(-50%);
    z-index: 2;
  }
  .event.done .event-dot { background: #AAAAAA; }
  .event.active .event-dot {
    background: #000000;
    outline: 3px solid #AAAAAA;
    outline-offset: 3px;
  }
  .event-above {
    position: absolute;
    bottom: calc(50% + 18px);
    text-align: center;
    width: 140px;
    left: 50%; transform: translateX(-50%);
  }
  .event-below {
    position: absolute;
    top: calc(50% + 18px);
    text-align: center;
    width: 140px;
    left: 50%; transform: translateX(-50%);
  }
  .event-date {
    font-size: 11px; font-weight: 700;
    color: #888888;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-bottom: 3px;
  }
  .event.done .event-date { color: #AAAAAA; }
  .event-label {
    font-size: 13px; font-weight: 700;
    color: #000000;
    line-height: 1.2;
    margin-bottom: 3px;
    text-transform: uppercase;
    letter-spacing: -0.3px;
  }
  .event.done .event-label { color: #AAAAAA; }
  .event-detail {
    font-size: 11px; color: #888888;
    line-height: 1.2;
  }
</style>
</head>
<body>
  <div class="band">
    <p class="band-label">03. Roadmap</p>
  </div>
  <div class="slide-inner">
    <h2>03 — ロードマップ</h2>
    <div class="title-rule"></div>
    <p class="slide-title">2026年度 実施ロードマップ</p>
    <div class="timeline-wrap">
      <div class="timeline-axis"></div>
      <div class="event done" style="left:8%">
        <div class="event-dot"></div>
        <div class="event-above">
          <p class="event-date">4月</p>
          <p class="event-label">キックオフ</p>
          <p class="event-detail">体制・スコープ確定</p>
        </div>
      </div>
      <div class="event done" style="left:24%">
        <div class="event-dot"></div>
        <div class="event-below">
          <p class="event-date">5月</p>
          <p class="event-label">ベンダー契約</p>
          <p class="event-detail">3社コンペで決定</p>
        </div>
      </div>
      <div class="event active" style="left:42%">
        <div class="event-dot"></div>
        <div class="event-above">
          <p class="event-date">6〜8月</p>
          <p class="event-label">開発・テスト</p>
          <p class="event-detail">MVP→UAT→本番準備</p>
        </div>
      </div>
      <div class="event" style="left:62%">
        <div class="event-dot"></div>
        <div class="event-below">
          <p class="event-date">9月</p>
          <p class="event-label">段階リリース</p>
          <p class="event-detail">10%→50%→全体</p>
        </div>
      </div>
      <div class="event" style="left:80%">
        <div class="event-dot"></div>
        <div class="event-above">
          <p class="event-date">10〜12月</p>
          <p class="event-label">効果測定</p>
          <p class="event-detail">KPI達成状況評価</p>
        </div>
      </div>
      <div class="event" style="left:96%">
        <div class="event-dot"></div>
        <div class="event-below">
          <p class="event-date">翌年1月</p>
          <p class="event-label">次年度計画</p>
          <p class="event-detail">Phase2の検討開始</p>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
