<!--
  Pattern: chart-bar
  Theme: B&W Swiss
  Category: Data
  Text Guidelines:
  - Title: max 30 characters
  - Bars: 4 to 7 (horizontal, CSS-based)
  - Bar label: max 15 characters
  - Value: shown at bar end
  - Source: max 50 characters
-->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 960px; height: 540px;
    background: #FFFFFF;
    font-family: Arial, Helvetica, sans-serif;
    overflow: hidden;
    position: relative;
  }
  .band {
    position: absolute; left: 0; top: 0;
    width: 50px; height: 100%;
    background: #000000;
    display: flex; align-items: center; justify-content: center;
  }
  .band-label {
    writing-mode: vertical-rl;
    transform: rotate(180deg);
    font-size: 10px; font-weight: 700;
    color: rgba(255,255,255,0.5);
    letter-spacing: 3px;
    text-transform: uppercase;
  }
  .slide-inner {
    position: absolute;
    left: 70px; top: 40px;
    width: 860px; height: 460px;
  }
  h2 {
    font-size: 13px; font-weight: 700;
    color: #666666;
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .title-rule {
    width: 100%; height: 2px;
    background: #000000;
    margin-bottom: 8px;
  }
  .slide-title {
    font-size: 22px; font-weight: 700;
    color: #000000;
    letter-spacing: -0.5px;
    margin-bottom: 24px;
    text-transform: uppercase;
  }
  .chart-rows {
    display: flex; flex-direction: column;
    gap: 18px;
  }
  .bar-row {
    display: flex; align-items: center; gap: 0;
  }
  .bar-label {
    width: 130px;
    font-size: 14px; font-weight: 700;
    color: #000000;
    text-align: right;
    padding-right: 16px;
    flex-shrink: 0;
  }
  .bar-track {
    flex: 1; height: 28px;
    background: #F0F0F0;
    position: relative;
  }
  .bar-fill {
    height: 100%;
    background: #000000;
  }
  .bar-fill.secondary { background: #555555; }
  .bar-fill.tertiary { background: #AAAAAA; }
  .bar-value {
    position: absolute; right: -60px;
    font-size: 14px; font-weight: 700;
    color: #000000;
    white-space: nowrap;
    top: 50%; transform: translateY(-50%);
  }
  .note {
    font-size: 11px; color: #AAAAAA;
    margin-top: 20px;
    letter-spacing: 0.3px;
  }
</style>
</head>
<body>
  <div class="band">
    <p class="band-label">02. Data</p>
  </div>
  <div class="slide-inner">
    <h2>02 — 市場データ</h2>
    <div class="title-rule"></div>
    <p class="slide-title">チャネル別 月間売上構成比（2026年2月）</p>
    <div class="chart-rows">
      <div class="bar-row">
        <span class="bar-label">スマホアプリ</span>
        <div class="bar-track">
          <div class="bar-fill" style="width:61%">
            <span class="bar-value">61%　¥2.56億</span>
          </div>
        </div>
      </div>
      <div class="bar-row">
        <span class="bar-label">モバイルWeb</span>
        <div class="bar-track">
          <div class="bar-fill secondary" style="width:18%">
            <span class="bar-value">18%　¥0.76億</span>
          </div>
        </div>
      </div>
      <div class="bar-row">
        <span class="bar-label">PC Web</span>
        <div class="bar-track">
          <div class="bar-fill secondary" style="width:14%">
            <span class="bar-value">14%　¥0.59億</span>
          </div>
        </div>
      </div>
      <div class="bar-row">
        <span class="bar-label">電話注文</span>
        <div class="bar-track">
          <div class="bar-fill tertiary" style="width:5%">
            <span class="bar-value">5%　¥0.21億</span>
          </div>
        </div>
      </div>
      <div class="bar-row">
        <span class="bar-label">その他</span>
        <div class="bar-track">
          <div class="bar-fill tertiary" style="width:2%">
            <span class="bar-value">2%　¥0.08億</span>
          </div>
        </div>
      </div>
    </div>
    <p class="note">出典：社内売上管理システム（2026年2月末データ）</p>
  </div>
</body>
</html>
