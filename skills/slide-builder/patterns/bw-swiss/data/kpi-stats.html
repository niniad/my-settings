<!--
  Pattern: kpi-stats
  Theme: B&W Swiss
  Category: Data
  Text Guidelines:
  - Title: max 30 characters
  - KPI count: 2 to 4 metrics
  - Each KPI number: max 10 characters
  - Each KPI label: max 20 characters
  - Each KPI sub note: max 35 characters
-->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 960px; height: 540px;
    background: #FFFFFF;
    font-family: Arial, Helvetica, sans-serif;
    overflow: hidden;
    position: relative;
  }
  .band {
    position: absolute; left: 0; top: 0;
    width: 50px; height: 100%;
    background: #000000;
    display: flex; align-items: center; justify-content: center;
  }
  .band-label {
    writing-mode: vertical-rl;
    transform: rotate(180deg);
    font-size: 10px; font-weight: 700;
    color: rgba(255,255,255,0.5);
    letter-spacing: 3px;
    text-transform: uppercase;
  }
  .slide-inner {
    position: absolute;
    left: 70px; top: 40px;
    width: 860px; height: 460px;
  }
  h2 {
    font-size: 13px; font-weight: 700;
    color: #666666;
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .title-rule {
    width: 100%; height: 2px;
    background: #000000;
    margin-bottom: 8px;
  }
  .slide-title {
    font-size: 24px; font-weight: 700;
    color: #000000;
    letter-spacing: -1px;
    margin-bottom: 24px;
    text-transform: uppercase;
  }
  .kpi-grid {
    display: flex; gap: 0;
    height: 280px;
  }
  .kpi-card {
    flex: 1;
    display: flex; flex-direction: column;
    justify-content: center;
    padding: 24px 20px;
    border: 2px solid #000000;
    margin-right: -2px;
  }
  .kpi-card:last-child { margin-right: 0; }
  .kpi-label {
    font-size: 11px; font-weight: 700;
    color: #888888;
    letter-spacing: 2.5px;
    text-transform: uppercase;
    margin-bottom: 12px;
  }
  .kpi-number {
    font-size: 60px; font-weight: 700;
    color: #000000;
    letter-spacing: -3px;
    line-height: 1;
    margin-bottom: 8px;
  }
  .kpi-unit {
    font-size: 20px; font-weight: 400;
    letter-spacing: 0;
    vertical-align: top;
    line-height: 2;
  }
  .kpi-desc {
    font-size: 13px; color: #888888;
    line-height: 1.3;
    margin-bottom: 6px;
  }
  .kpi-trend {
    font-size: 13px; font-weight: 700;
    color: #000000;
  }
  .trend-up { color: #000000; }
  .trend-down { color: #555555; }
  .kpi-rule {
    width: 30px; height: 2px;
    background: #000000;
    margin-bottom: 12px;
  }
</style>
</head>
<body>
  <div class="band">
    <p class="band-label">01. Overview</p>
  </div>
  <div class="slide-inner">
    <h2>01 — 現状サマリー</h2>
    <div class="title-rule"></div>
    <p class="slide-title">重要業績指標（2026年2月時点）</p>
    <div class="kpi-grid">
      <div class="kpi-card">
        <p class="kpi-label">月間売上</p>
        <div class="kpi-rule"></div>
        <p class="kpi-number"><span class="kpi-unit">¥</span>4.2億</p>
        <p class="kpi-desc">前年同月比</p>
        <p class="kpi-trend trend-up">↑ +18.4%</p>
      </div>
      <div class="kpi-card">
        <p class="kpi-label">購買転換率</p>
        <div class="kpi-rule"></div>
        <p class="kpi-number">2.1<span class="kpi-unit" style="font-size:24px">%</span></p>
        <p class="kpi-desc">業界平均は3.4%</p>
        <p class="kpi-trend trend-down">↓ −0.3pt（前月比）</p>
      </div>
      <div class="kpi-card">
        <p class="kpi-label">顧客獲得単価</p>
        <div class="kpi-rule"></div>
        <p class="kpi-number"><span class="kpi-unit">¥</span>3,840</p>
        <p class="kpi-desc">目標は ¥2,500</p>
        <p class="kpi-trend trend-down">↓ 前年比 +32%悪化</p>
      </div>
      <div class="kpi-card">
        <p class="kpi-label">アプリMAU</p>
        <div class="kpi-rule"></div>
        <p class="kpi-number">124<span class="kpi-unit" style="font-size:20px">万</span></p>
        <p class="kpi-desc">月間アクティブユーザー</p>
        <p class="kpi-trend trend-up">↑ +6.2%（前月比）</p>
      </div>
    </div>
  </div>
</body>
</html>
