<!--
  Pattern: cta-closing
  Theme: B&W Swiss
  Category: Structural
  Text Guidelines:
  - Title: max 25 characters
  - CTA headline: max 40 characters
  - Action items: 1 to 3 actions
  - Each action label: max 35 chars + detail max 40 chars + owner max 20 chars
-->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 960px; height: 540px;
    background: #FFFFFF;
    font-family: Arial, Helvetica, sans-serif;
    overflow: hidden;
    position: relative;
  }
  .band {
    position: absolute; left: 0; top: 0;
    width: 50px; height: 100%;
    background: #000000;
    display: flex; align-items: center; justify-content: center;
  }
  .band-label {
    writing-mode: vertical-rl;
    transform: rotate(180deg);
    font-size: 10px; font-weight: 700;
    color: rgba(255,255,255,0.5);
    letter-spacing: 3px;
    text-transform: uppercase;
  }
  .slide-inner {
    position: absolute;
    left: 70px; top: 40px;
    width: 860px; height: 460px;
  }
  h2 {
    font-size: 13px; font-weight: 700;
    color: #666666;
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .title-rule {
    width: 100%; height: 2px;
    background: #000000;
    margin-bottom: 16px;
  }
  .cta-headline {
    font-size: 20px; font-weight: 700;
    color: #000000;
    margin-bottom: 24px;
    letter-spacing: -0.5px;
  }
  .actions {
    display: flex; flex-direction: column; gap: 0;
  }
  .action-item {
    display: flex; align-items: stretch;
    border-bottom: 1px solid #E0E0E0;
    padding: 14px 0;
  }
  .action-num {
    font-size: 36px; font-weight: 700;
    color: #E0E0E0;
    width: 52px;
    flex-shrink: 0;
    letter-spacing: -2px;
    line-height: 1;
    margin-top: 2px;
  }
  .action-content { flex: 1; }
  .action-label {
    font-size: 17px; font-weight: 700;
    color: #000000;
    margin-bottom: 3px;
    letter-spacing: -0.3px;
  }
  .action-detail {
    font-size: 13px; color: #888888;
  }
  .action-meta {
    font-size: 12px; font-weight: 700;
    color: #000000;
    text-align: right;
    white-space: nowrap;
    letter-spacing: 0.5px;
    padding-top: 4px;
  }
</style>
</head>
<body>
  <div class="band">
    <p class="band-label">Next Steps</p>
  </div>
  <div class="slide-inner">
    <h2>Next Actions</h2>
    <div class="title-rule"></div>
    <p class="cta-headline">本日のご承認をもとに、4月より実行フェーズへ移行します</p>
    <div class="actions">
      <div class="action-item">
        <div class="action-num">1</div>
        <div class="action-content">
          <p class="action-label">予算計画書の最終承認</p>
          <p class="action-detail">経営会議にて承認後、調達部門へ発注指示</p>
        </div>
        <p class="action-meta">4月15日 / 経営会議</p>
      </div>
      <div class="action-item">
        <div class="action-num">2</div>
        <div class="action-content">
          <p class="action-label">外部ベンダー選定・契約締結</p>
          <p class="action-detail">3社コンペを経て最終ベンダーを決定</p>
        </div>
        <p class="action-meta">4月末 / 調達部</p>
      </div>
      <div class="action-item">
        <div class="action-num">3</div>
        <div class="action-content">
          <p class="action-label">プロジェクトキックオフ</p>
          <p class="action-detail">PMO設置・スコープ確定・体制構築</p>
        </div>
        <p class="action-meta">5月1日 / 企画部</p>
      </div>
    </div>
  </div>
</body>
</html>
