<!--
  Pattern: title-cover
  Theme: B&W Swiss
  Category: Structural
  Text Guidelines:
  - Main title: max 35 characters
  - Subtitle: max 50 characters
  - Author/Presenter: max 30 characters
  - Date/Organization: max 20 characters
-->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 960px; height: 540px;
    background: #FFFFFF;
    font-family: Arial, Helvetica, sans-serif;
    overflow: hidden;
    position: relative;
  }
  /* Left black band with vertical label */
  .band {
    position: absolute; left: 0; top: 0;
    width: 50px; height: 100%;
    background: #000000;
    display: flex; align-items: center; justify-content: center;
  }
  .band-label {
    writing-mode: vertical-rl;
    transform: rotate(180deg);
    font-size: 10px; font-weight: 700;
    color: rgba(255,255,255,0.5);
    letter-spacing: 3px;
    text-transform: uppercase;
  }
  /* Right black panel */
  .right-panel {
    position: absolute; right: 0; top: 0;
    width: 240px; height: 100%;
    background: #000000;
  }
  .slide-content {
    position: absolute;
    left: 70px; right: 260px; top: 0; bottom: 0;
    display: flex; flex-direction: column;
    justify-content: center;
    padding: 48px 48px 48px 20px;
  }
  .eyebrow {
    font-size: 11px; font-weight: 700;
    color: #666666;
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-bottom: 24px;
  }
  h1 {
    font-size: 52px; font-weight: 700;
    color: #000000;
    letter-spacing: -2px; line-height: 1.05;
    text-transform: uppercase;
    margin-bottom: 0;
  }
  .rule {
    width: 100%; height: 2px;
    background: #000000;
    margin: 24px 0;
  }
  .subtitle {
    font-size: 18px; font-weight: 400;
    color: #555555;
    line-height: 1.4;
    margin-bottom: 40px;
  }
  .meta {
    display: flex; flex-direction: column; gap: 4px;
  }
  .author {
    font-size: 14px; font-weight: 700;
    color: #000000;
    letter-spacing: 1px;
    text-transform: uppercase;
  }
  .date {
    font-size: 13px; color: #888888;
    letter-spacing: 0.5px;
  }
</style>
</head>
<body>
  <div class="band">
    <p class="band-label">Proposal</p>
  </div>
  <div class="right-panel"></div>
  <div class="slide-content">
    <p class="eyebrow">Strategic Document</p>
    <h1>新規事業<br>参入戦略<br>2026</h1>
    <div class="rule"></div>
    <p class="subtitle">市場機会の分析と<br>優先施策の提言</p>
    <div class="meta">
      <p class="author">山田 太郎 — 戦略企画部</p>
      <p class="date">2026.03.14</p>
    </div>
  </div>
</body>
</html>
