<!--
  Pattern: thankyou-qa
  Theme: B&W Swiss
  Category: Structural
  Text Guidelines:
  - Main text: short farewell (fixed)
  - Q&A label: "Q & A"
  - Optional contact info
-->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 960px; height: 540px;
    background: #000000;
    font-family: Arial, Helvetica, sans-serif;
    overflow: hidden;
    position: relative;
  }
  /* White content panel left 2/3 */
  .white-panel {
    position: absolute; left: 0; top: 0;
    width: 640px; height: 100%;
    background: #FFFFFF;
    display: flex; flex-direction: column;
    justify-content: center;
    padding: 60px 60px 60px 60px;
  }
  .rule-top {
    width: 60px; height: 3px;
    background: #000000;
    margin-bottom: 32px;
  }
  .thank-you {
    font-size: 48px; font-weight: 700;
    color: #000000;
    letter-spacing: -2px;
    line-height: 1.05;
    text-transform: uppercase;
    margin-bottom: 28px;
  }
  .rule-mid {
    width: 100%; height: 2px;
    background: #000000;
    margin-bottom: 24px;
  }
  .qa-label {
    font-size: 16px; font-weight: 700;
    color: #666666;
    letter-spacing: 5px;
    text-transform: uppercase;
    margin-bottom: 28px;
  }
  .contact {
    font-size: 13px; color: #888888;
    line-height: 1.8;
  }
  .contact strong {
    color: #000000;
    font-weight: 700;
    font-size: 14px;
  }
  /* Black right panel */
  .black-panel {
    position: absolute; right: 0; top: 0;
    width: 320px; height: 100%;
    background: #000000;
    display: flex; align-items: center; justify-content: center;
  }
  .panel-text {
    writing-mode: vertical-rl;
    font-size: 60px; font-weight: 700;
    color: rgba(255,255,255,0.06);
    letter-spacing: -3px;
    text-transform: uppercase;
  }
</style>
</head>
<body>
  <div class="white-panel">
    <div class="rule-top"></div>
    <p class="thank-you">ご清聴<br>ありがとう<br>ございました</p>
    <div class="rule-mid"></div>
    <p class="qa-label">Q &amp; A</p>
    <p class="contact">
      <strong>山田 太郎</strong>　戦略企画部<br>
      yamada.taro@company.co.jp
    </p>
  </div>
  <div class="black-panel">
    <p class="panel-text">Thank you</p>
  </div>
</body>
</html>
