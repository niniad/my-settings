<!--
  Pattern: section-divider
  Theme: B&W Swiss
  Category: Structural
  Text Guidelines:
  - Section number: "01" to "09"
  - Section title: max 25 characters
  - Optional subtitle: max 50 characters
-->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 960px; height: 540px;
    background: #FFFFFF;
    font-family: Arial, Helvetica, sans-serif;
    overflow: hidden;
    position: relative;
  }
  /* Full black left panel */
  .left-panel {
    position: absolute; left: 0; top: 0;
    width: 360px; height: 100%;
    background: #000000;
    display: flex; flex-direction: column;
    justify-content: flex-end;
    padding: 40px;
  }
  .section-num {
    font-size: 120px; font-weight: 700;
    color: rgba(255,255,255,0.1);
    letter-spacing: -6px;
    line-height: 1;
    margin-bottom: 0;
  }
  .section-word {
    font-size: 11px; font-weight: 700;
    color: rgba(255,255,255,0.4);
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-bottom: 60px;
  }
  /* Right content area */
  .right-panel {
    position: absolute; left: 360px; top: 0;
    width: 600px; height: 100%;
    display: flex; flex-direction: column;
    justify-content: center;
    padding: 0 60px;
  }
  .rule-top {
    width: 100%; height: 2px;
    background: #000000;
    margin-bottom: 28px;
  }
  h2 {
    font-size: 44px; font-weight: 700;
    color: #000000;
    letter-spacing: -2px;
    line-height: 1.05;
    text-transform: uppercase;
    margin-bottom: 20px;
  }
  .rule-bottom {
    width: 100%; height: 2px;
    background: #000000;
    margin-bottom: 20px;
  }
  .desc {
    font-size: 16px; color: #666666;
    line-height: 1.5;
  }
</style>
</head>
<body>
  <div class="left-panel">
    <p class="section-word">Section</p>
    <p class="section-num">01</p>
  </div>
  <div class="right-panel">
    <div class="rule-top"></div>
    <h2>市場環境と<br>現状分析</h2>
    <div class="rule-bottom"></div>
    <p class="desc">国内EC市場の成長トレンドと<br>競合ポジショニングの確認</p>
  </div>
</body>
</html>
