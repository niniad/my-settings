<!--
  Pattern: summary
  Theme: B&W Swiss
  Category: Structural
  Text Guidelines:
  - Title: max 20 characters
  - Points: 3 to 5 key takeaways
  - Each point: max 50 characters
  - Supporting detail: max 60 characters (optional)
-->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 960px; height: 540px;
    background: #FFFFFF;
    font-family: Arial, Helvetica, sans-serif;
    overflow: hidden;
    position: relative;
  }
  .band {
    position: absolute; left: 0; top: 0;
    width: 50px; height: 100%;
    background: #000000;
    display: flex; align-items: center; justify-content: center;
  }
  .band-label {
    writing-mode: vertical-rl;
    transform: rotate(180deg);
    font-size: 10px; font-weight: 700;
    color: rgba(255,255,255,0.5);
    letter-spacing: 3px;
    text-transform: uppercase;
  }
  .slide-inner {
    position: absolute;
    left: 70px; top: 40px;
    width: 860px; height: 460px;
  }
  h2 {
    font-size: 13px; font-weight: 700;
    color: #666666;
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .title-rule {
    width: 100%; height: 2px;
    background: #000000;
    margin-bottom: 28px;
  }
  .summary-list {
    display: flex; flex-direction: column; gap: 14px;
  }
  .summary-item {
    display: flex; align-items: flex-start; gap: 20px;
    padding-bottom: 14px;
    border-bottom: 1px solid #E0E0E0;
  }
  .item-num {
    font-size: 28px; font-weight: 700;
    color: #DDDDDD;
    width: 36px;
    flex-shrink: 0;
    line-height: 1;
    letter-spacing: -1px;
  }
  .item-content { flex: 1; }
  .item-main {
    font-size: 19px; font-weight: 700;
    color: #000000;
    margin-bottom: 3px;
    letter-spacing: -0.3px;
  }
  .item-sub {
    font-size: 13px; color: #888888;
    line-height: 1.3;
  }
</style>
</head>
<body>
  <div class="band">
    <p class="band-label">Summary</p>
  </div>
  <div class="slide-inner">
    <h2>Summary</h2>
    <div class="title-rule"></div>
    <div class="summary-list">
      <div class="summary-item">
        <span class="item-num">1</span>
        <div class="item-content">
          <p class="item-main">国内EC市場は年率12%成長を継続している</p>
          <p class="item-sub">2026年度の市場規模は約22兆円に達する見込み</p>
        </div>
      </div>
      <div class="summary-item">
        <span class="item-num">2</span>
        <div class="item-content">
          <p class="item-main">自社のデジタル投資は競合比で3年遅れている</p>
          <p class="item-sub">モバイルUXとパーソナライズ機能が特に不足</p>
        </div>
      </div>
      <div class="summary-item">
        <span class="item-num">3</span>
        <div class="item-content">
          <p class="item-main">優先施策3つで翌期ROI 180%が達成可能</p>
          <p class="item-sub">アプリ刷新・レコメンド導入・広告最適化の順で実行</p>
        </div>
      </div>
      <div class="summary-item">
        <span class="item-num">4</span>
        <div class="item-content">
          <p class="item-main">Q2開始に向けて予算承認が最初のマイルストーン</p>
          <p class="item-sub">4月末までに経営会議での承認が必要</p>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
