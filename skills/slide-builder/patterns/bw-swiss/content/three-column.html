<!--
  Pattern: three-column
  Theme: B&W Swiss
  Category: Content
  Text Guidelines:
  - Title: max 30 characters
  - Each column header: max 15 characters
  - Each column body: 2 to 4 lines or items, each max 40 characters
-->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 960px; height: 540px;
    background: #FFFFFF;
    font-family: Arial, Helvetica, sans-serif;
    overflow: hidden;
    position: relative;
  }
  .band {
    position: absolute; left: 0; top: 0;
    width: 50px; height: 100%;
    background: #000000;
    display: flex; align-items: center; justify-content: center;
  }
  .band-label {
    writing-mode: vertical-rl;
    transform: rotate(180deg);
    font-size: 10px; font-weight: 700;
    color: rgba(255,255,255,0.5);
    letter-spacing: 3px;
    text-transform: uppercase;
  }
  .slide-inner {
    position: absolute;
    left: 70px; top: 40px;
    width: 860px; height: 460px;
  }
  h2 {
    font-size: 13px; font-weight: 700;
    color: #666666;
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .title-rule {
    width: 100%; height: 2px;
    background: #000000;
    margin-bottom: 8px;
  }
  .slide-title {
    font-size: 26px; font-weight: 700;
    color: #000000;
    letter-spacing: -1px;
    margin-bottom: 20px;
    text-transform: uppercase;
  }
  .cols {
    display: flex; gap: 0;
    height: 310px;
  }
  .col {
    flex: 1;
    padding: 20px;
    border: 2px solid #000000;
    display: flex; flex-direction: column;
    margin-right: -2px;
  }
  .col:last-child { margin-right: 0; }
  .col-num {
    font-size: 48px; font-weight: 700;
    color: #EEEEEE;
    letter-spacing: -3px;
    line-height: 1;
    margin-bottom: 8px;
  }
  .col-header {
    font-size: 16px; font-weight: 700;
    color: #000000;
    text-transform: uppercase;
    letter-spacing: -0.5px;
    margin-bottom: 10px;
    padding-bottom: 8px;
    border-bottom: 2px solid #000000;
  }
  .col-body {
    font-size: 14px; color: #555555;
    line-height: 1.6;
    flex: 1;
    list-style: none;
  }
  .col-body li {
    padding-left: 12px;
    position: relative;
    margin-bottom: 5px;
  }
  .col-body li::before {
    content: '—';
    position: absolute;
    left: 0;
    color: #AAAAAA;
  }
  .col-tag {
    font-size: 11px; font-weight: 700;
    color: #888888;
    letter-spacing: 1.5px;
    text-transform: uppercase;
    margin-top: 12px;
  }
</style>
</head>
<body>
  <div class="band">
    <p class="band-label">03. Strategy</p>
  </div>
  <div class="slide-inner">
    <h2>03 — 優先施策</h2>
    <div class="title-rule"></div>
    <p class="slide-title">3つの優先施策領域</p>
    <div class="cols">
      <div class="col">
        <p class="col-num">1</p>
        <p class="col-header">アプリUX刷新</p>
        <ul class="col-body">
          <li>ナビゲーション再設計</li>
          <li>検索機能強化</li>
          <li>チェックアウト簡略化</li>
          <li>パフォーマンス最適化</li>
        </ul>
        <p class="col-tag">Q2〜Q3 / 開発部</p>
      </div>
      <div class="col">
        <p class="col-num">2</p>
        <p class="col-header">AIレコメンド</p>
        <ul class="col-body">
          <li>協調フィルタリング実装</li>
          <li>リアルタイム行動追跡</li>
          <li>メール・プッシュ連携</li>
          <li>A/Bテスト自動化</li>
        </ul>
        <p class="col-tag">Q3 / データ部</p>
      </div>
      <div class="col">
        <p class="col-num">3</p>
        <p class="col-header">広告最適化</p>
        <ul class="col-body">
          <li>AI入札への完全移行</li>
          <li>クリエイティブ自動生成</li>
          <li>アトリビューション整備</li>
          <li>予算配分ルール策定</li>
        </ul>
        <p class="col-tag">Q2 / マーケ部</p>
      </div>
    </div>
  </div>
</body>
</html>
