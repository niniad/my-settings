<!--
  Pattern: text-image
  Theme: B&W Swiss
  Category: Content
  Text Guidelines:
  - Title: max 30 characters
  - Body text: 3 to 5 sentences/bullets (left column)
  - Image area: right column placeholder
  - Caption: max 30 characters
-->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 960px; height: 540px;
    background: #FFFFFF;
    font-family: Arial, Helvetica, sans-serif;
    overflow: hidden;
    position: relative;
  }
  .band {
    position: absolute; left: 0; top: 0;
    width: 50px; height: 100%;
    background: #000000;
    display: flex; align-items: center; justify-content: center;
  }
  .band-label {
    writing-mode: vertical-rl;
    transform: rotate(180deg);
    font-size: 10px; font-weight: 700;
    color: rgba(255,255,255,0.5);
    letter-spacing: 3px;
    text-transform: uppercase;
  }
  .slide-inner {
    position: absolute;
    left: 70px; top: 40px;
    width: 860px; height: 460px;
  }
  h2 {
    font-size: 13px; font-weight: 700;
    color: #666666;
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .title-rule {
    width: 100%; height: 2px;
    background: #000000;
    margin-bottom: 8px;
  }
  .slide-title {
    font-size: 26px; font-weight: 700;
    color: #000000;
    letter-spacing: -1px;
    margin-bottom: 18px;
    text-transform: uppercase;
  }
  .layout {
    display: flex; gap: 36px;
    height: 330px;
  }
  .text-col {
    flex: 0 0 440px;
  }
  p.body-text {
    font-size: 16px; color: #333333;
    line-height: 1.6;
    margin-bottom: 12px;
  }
  .highlight-box {
    background: #F5F5F5;
    border-left: 3px solid #000000;
    padding: 12px 16px;
    margin-top: 8px;
  }
  .highlight-label {
    font-size: 11px; font-weight: 700;
    color: #000000;
    letter-spacing: 2px;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .highlight-text {
    font-size: 14px; color: #555555;
    line-height: 1.4;
  }
  .image-col {
    flex: 1;
    display: flex; flex-direction: column;
  }
  .image-placeholder {
    flex: 1;
    background: #F0F0F0;
    display: flex; align-items: center; justify-content: center;
    border: 2px solid #CCCCCC;
  }
  .image-placeholder-text {
    font-size: 13px; color: #BBBBBB;
    text-align: center;
    line-height: 1.6;
  }
  .caption {
    font-size: 11px; color: #AAAAAA;
    margin-top: 6px;
    text-align: right;
    letter-spacing: 0.3px;
  }
</style>
</head>
<body>
  <div class="band">
    <p class="band-label">02. Market</p>
  </div>
  <div class="slide-inner">
    <h2>02 — 市場分析</h2>
    <div class="title-rule"></div>
    <p class="slide-title">スマートフォン利用者の購買行動変化</p>
    <div class="layout">
      <div class="text-col">
        <p class="body-text">2023年以降、国内EC購入の61%がスマートフォン経由となり、PCを大きく上回る状況が続いている。</p>
        <p class="body-text">特に30代以下では「アプリで発見→即購入」という短時間コンバージョンが主流となり、ファネル設計の見直しが急務だ。</p>
        <p class="body-text">自社アプリのセッション時間は業界平均の65%にとどまり、UX改善が最大の成長機会となっている。</p>
        <div class="highlight-box">
          <p class="highlight-label">Key Insight</p>
          <p class="highlight-text">アプリUXを改善するだけで購買転換率が推定22%向上する可能性がある</p>
        </div>
      </div>
      <div class="image-col">
        <div class="image-placeholder">
          <p class="image-placeholder-text">グラフ・図表・画像<br>をここに配置</p>
        </div>
        <p class="caption">出典：総務省「通信利用動向調査」2025年版</p>
      </div>
    </div>
  </div>
</body>
</html>
