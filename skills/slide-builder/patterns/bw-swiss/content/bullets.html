<!--
  Pattern: bullets
  Theme: B&W Swiss
  Category: Content
  Text Guidelines:
  - Title: max 30 characters
  - Bullets: 4 to 7 items, each max 45 characters
  - Sub-bullet: max 55 characters (optional)
-->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 960px; height: 540px;
    background: #FFFFFF;
    font-family: Arial, Helvetica, sans-serif;
    overflow: hidden;
    position: relative;
  }
  .band {
    position: absolute; left: 0; top: 0;
    width: 50px; height: 100%;
    background: #000000;
    display: flex; align-items: center; justify-content: center;
  }
  .band-label {
    writing-mode: vertical-rl;
    transform: rotate(180deg);
    font-size: 10px; font-weight: 700;
    color: rgba(255,255,255,0.5);
    letter-spacing: 3px;
    text-transform: uppercase;
  }
  .slide-inner {
    position: absolute;
    left: 70px; top: 40px;
    width: 860px; height: 460px;
  }
  h2 {
    font-size: 13px; font-weight: 700;
    color: #666666;
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .title-rule {
    width: 100%; height: 2px;
    background: #000000;
    margin-bottom: 8px;
  }
  .slide-title {
    font-size: 30px; font-weight: 700;
    color: #000000;
    letter-spacing: -1px;
    margin-bottom: 24px;
    text-transform: uppercase;
  }
  .bullet-list {
    display: flex; flex-direction: column; gap: 0;
  }
  .bullet-item {
    display: flex; align-items: flex-start; gap: 16px;
    padding: 10px 0;
    border-bottom: 1px solid #EEEEEE;
  }
  .bullet-dash {
    font-size: 18px; font-weight: 700;
    color: #000000;
    flex-shrink: 0;
    line-height: 1.4;
    width: 16px;
  }
  .bullet-text { flex: 1; }
  .bullet-main {
    font-size: 18px; font-weight: 700;
    color: #000000;
    line-height: 1.3;
    margin-bottom: 2px;
  }
  .bullet-sub {
    font-size: 13px; color: #888888;
    line-height: 1.3;
  }
</style>
</head>
<body>
  <div class="band">
    <p class="band-label">02. Analysis</p>
  </div>
  <div class="slide-inner">
    <h2>02 — 課題分析</h2>
    <div class="title-rule"></div>
    <p class="slide-title">現状の主要課題</p>
    <div class="bullet-list">
      <div class="bullet-item">
        <span class="bullet-dash">—</span>
        <div class="bullet-text">
          <p class="bullet-main">モバイルアプリのUXが競合他社より3年遅れている</p>
          <p class="bullet-sub">直近のユーザー調査でも満足度スコアが業界最下位水準</p>
        </div>
      </div>
      <div class="bullet-item">
        <span class="bullet-dash">—</span>
        <div class="bullet-text">
          <p class="bullet-main">商品レコメンド精度が低く、回遊率・購買転換率が低迷</p>
          <p class="bullet-sub">カート離脱率が68%と業界平均の1.4倍</p>
        </div>
      </div>
      <div class="bullet-item">
        <span class="bullet-dash">—</span>
        <div class="bullet-text">
          <p class="bullet-main">広告費の配分最適化が未対応で費用対効果が悪化中</p>
          <p class="bullet-sub">CPA（顧客獲得単価）が前年比で32%上昇</p>
        </div>
      </div>
      <div class="bullet-item">
        <span class="bullet-dash">—</span>
        <div class="bullet-text">
          <p class="bullet-main">データ分析基盤が分散しており意思決定が遅い</p>
          <p class="bullet-sub">施策効果の把握に平均3週間かかる構造的問題</p>
        </div>
      </div>
      <div class="bullet-item">
        <span class="bullet-dash">—</span>
        <div class="bullet-text">
          <p class="bullet-main">顧客LTVの把握・活用ができていない</p>
          <p class="bullet-sub">優良顧客向けの特別施策がほぼ存在しない状態</p>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
