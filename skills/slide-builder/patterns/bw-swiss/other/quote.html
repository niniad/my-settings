<!--
  Pattern: quote
  Theme: B&W Swiss
  Category: Other
  Text Guidelines:
  - Quote text: 30 to 80 characters
  - Attribution name: max 25 characters
  - Attribution title: max 40 characters
  - Context note: max 60 characters (optional)
-->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 960px; height: 540px;
    background: #000000;
    font-family: Arial, Helvetica, sans-serif;
    overflow: hidden;
    position: relative;
  }
  /* Main white content area */
  .white-area {
    position: absolute;
    left: 0; top: 0;
    width: 700px; height: 100%;
    background: #FFFFFF;
    display: flex; flex-direction: column;
    justify-content: center;
    padding: 50px 60px;
  }
  .eyebrow {
    font-size: 11px; font-weight: 700;
    color: #AAAAAA;
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-bottom: 24px;
  }
  .quote-mark {
    font-size: 80px;
    color: #000000;
    opacity: 0.1;
    line-height: 0.7;
    font-family: Georgia, serif;
    margin-bottom: 12px;
  }
  .quote-text {
    font-size: 30px; font-weight: 700;
    color: #000000;
    letter-spacing: -1px;
    line-height: 1.3;
    text-transform: uppercase;
    margin-bottom: 28px;
  }
  .rule {
    width: 50px; height: 3px;
    background: #000000;
    margin-bottom: 20px;
  }
  .attr-name {
    font-size: 16px; font-weight: 700;
    color: #000000;
    text-transform: uppercase;
    letter-spacing: 0.5px;
    margin-bottom: 4px;
  }
  .attr-title {
    font-size: 13px; color: #888888;
  }
  .context-note {
    margin-top: 20px;
    border-left: 3px solid #000000;
    padding: 8px 12px;
    background: #F5F5F5;
  }
  .context-text {
    font-size: 12px; color: #888888;
    line-height: 1.4;
  }
  /* Black right panel */
  .black-panel {
    position: absolute; right: 0; top: 0;
    width: 260px; height: 100%;
    background: #000000;
    display: flex; align-items: center; justify-content: center;
  }
  .panel-quote {
    font-size: 200px; font-weight: 700;
    color: rgba(255,255,255,0.05);
    font-family: Georgia, serif;
    line-height: 1;
  }
</style>
</head>
<body>
  <div class="white-area">
    <p class="eyebrow">Expert Opinion</p>
    <div class="quote-mark">"</div>
    <p class="quote-text">デジタルへの投資を遅らせる企業は、<br>3年以内に市場の主役から外れる</p>
    <div class="rule"></div>
    <p class="attr-name">田中 一郎</p>
    <p class="attr-title">デジタル戦略研究所　所長 / 元Google日本法人CTO</p>
    <div class="context-note">
      <p class="context-text">2025年11月「日本デジタル変革フォーラム」基調講演より</p>
    </div>
  </div>
  <div class="black-panel">
    <p class="panel-quote">"</p>
  </div>
</body>
</html>
