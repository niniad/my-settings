<!--
  Pattern: pyramid
  Theme: B&W Swiss
  Category: Diagram
  Text Guidelines:
  - Title: max 30 characters
  - Layers: 3 to 5 levels
  - Each layer label: max 15 characters
  - Each layer description: max 35 characters
-->
<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    width: 960px; height: 540px;
    background: #FFFFFF;
    font-family: Arial, Helvetica, sans-serif;
    overflow: hidden;
    position: relative;
  }
  .band {
    position: absolute; left: 0; top: 0;
    width: 50px; height: 100%;
    background: #000000;
    display: flex; align-items: center; justify-content: center;
  }
  .band-label {
    writing-mode: vertical-rl;
    transform: rotate(180deg);
    font-size: 10px; font-weight: 700;
    color: rgba(255,255,255,0.5);
    letter-spacing: 3px;
    text-transform: uppercase;
  }
  .slide-inner {
    position: absolute;
    left: 70px; top: 40px;
    width: 860px; height: 460px;
  }
  h2 {
    font-size: 13px; font-weight: 700;
    color: #666666;
    letter-spacing: 4px;
    text-transform: uppercase;
    margin-bottom: 8px;
  }
  .title-rule {
    width: 100%; height: 2px;
    background: #000000;
    margin-bottom: 6px;
  }
  .slide-title {
    font-size: 20px; font-weight: 700;
    color: #000000;
    letter-spacing: -0.5px;
    margin-bottom: 12px;
    text-transform: uppercase;
  }
  .pyramid-layout {
    display: flex; gap: 40px;
    align-items: center;
    height: 330px;
  }
  .pyramid-shape {
    display: flex; flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    gap: 3px;
    flex-shrink: 0;
    width: 360px;
  }
  .pyramid-level {
    display: flex; align-items: center; justify-content: center;
    height: 54px;
    font-size: 14px; font-weight: 700;
    text-align: center;
    clip-path: polygon(8% 0%, 92% 0%, 100% 100%, 0% 100%);
    letter-spacing: 0.5px;
    text-transform: uppercase;
  }
  .level-1 { width: 100px; background: #000000; color: white; font-size: 12px; clip-path: polygon(12% 0%, 88% 0%, 100% 100%, 0% 100%); }
  .level-2 { width: 180px; background: #333333; color: white; }
  .level-3 { width: 260px; background: #666666; color: white; }
  .level-4 { width: 340px; background: #999999; color: white; }
  .level-5 { width: 360px; background: #CCCCCC; color: #000000; clip-path: polygon(4% 0%, 96% 0%, 100% 100%, 0% 100%); }
  .pyramid-descs {
    flex: 1;
    display: flex; flex-direction: column;
    justify-content: space-around;
    height: 310px;
  }
  .pyramid-desc {
    display: flex; align-items: flex-start; gap: 12px;
    padding: 5px 0;
    border-bottom: 1px solid #EEEEEE;
  }
  .desc-marker {
    width: 12px; height: 12px;
    flex-shrink: 0;
    margin-top: 4px;
  }
  .desc-content { flex: 1; }
  .desc-label {
    font-size: 15px; font-weight: 700;
    color: #000000;
    margin-bottom: 2px;
    text-transform: uppercase;
    letter-spacing: -0.3px;
  }
  .desc-text {
    font-size: 12px; color: #888888;
    line-height: 1.3;
  }
</style>
</head>
<body>
  <div class="band">
    <p class="band-label">03. Strategy</p>
  </div>
  <div class="slide-inner">
    <h2>03 — 戦略体系</h2>
    <div class="title-rule"></div>
    <p class="slide-title">デジタル戦略の優先度ピラミッド</p>
    <div class="pyramid-layout">
      <div class="pyramid-shape">
        <div class="pyramid-level level-1">ビジョン</div>
        <div class="pyramid-level level-2">目標・KPI</div>
        <div class="pyramid-level level-3">優先施策</div>
        <div class="pyramid-level level-4">実行プラン</div>
        <div class="pyramid-level level-5">基盤インフラ</div>
      </div>
      <div class="pyramid-descs">
        <div class="pyramid-desc">
          <div class="desc-marker" style="background:#000000"></div>
          <div class="desc-content">
            <p class="desc-label">ビジョン</p>
            <p class="desc-text">デジタルEC業界のリーディングカンパニーへ</p>
          </div>
        </div>
        <div class="pyramid-desc">
          <div class="desc-marker" style="background:#333333"></div>
          <div class="desc-content">
            <p class="desc-label">目標・KPI</p>
            <p class="desc-text">売上3年で2倍・CVR4%・NPS +40</p>
          </div>
        </div>
        <div class="pyramid-desc">
          <div class="desc-marker" style="background:#666666"></div>
          <div class="desc-content">
            <p class="desc-label">優先施策</p>
            <p class="desc-text">アプリ刷新・レコメンド・広告最適化の3本柱</p>
          </div>
        </div>
        <div class="pyramid-desc">
          <div class="desc-marker" style="background:#999999"></div>
          <div class="desc-content">
            <p class="desc-label">実行プラン</p>
            <p class="desc-text">四半期ロードマップ・担当部門・予算配分</p>
          </div>
        </div>
        <div class="pyramid-desc">
          <div class="desc-marker" style="background:#CCCCCC"></div>
          <div class="desc-content">
            <p class="desc-label">基盤インフラ</p>
            <p class="desc-text">データ基盤・セキュリティ・組織体制の整備</p>
          </div>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
